# AI KOL / 平台热榜 自动采集 (每日 2 次: 9:30 / 15:25 CST)
# 全公开接口 + 纯 HTTP UA 伪装; 东财 WAF 失败时自动降级
name: auto-kol-collector
on:
  schedule:
    - cron: '30 1 * * *'     # 09:30 CST
    - cron: '25 7 * * *'     # 15:25 CST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Collect KOL & platform news
        run: |
          set -e
          python3 << 'PYEOF'
          import datetime, json, urllib.request, re, time
          from pathlib import Path

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36",
                "Referer": "https://s.weibo.com/"}

          def get(url, headers=None, retries=3):
              h = dict(UA)
              if headers: h.update(headers)
              for i in range(retries):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=15).read().decode("utf-8","replace")
                  except Exception:
                      if i == retries-1: raise
                      time.sleep(1)

          def douyin_hot(limit=15):
              url=("https://www.douyin.com/aweme/v1/web/hot/search/list/"
                   "?device_platform=webapp&aid=6383&channel=channel_pc_web"
                   "&source=9&hot_board_content=hot_board_default&hot_board_duration=7200")
              try:
                  body=get(url, headers={"Referer":"https://www.douyin.com/hot"})
                  d=json.loads(body)
                  items=[]
                  for w in (d.get("data") or {}).get("word_list") or []:
                      word=str(w.get("word","")).strip()
                      if len(word) < 4: continue
                      items.append({"ts":"", "title":f"[抖音热榜] {word}",
                                     "src":"douyin-hot", "hot_value":w.get("hot_value"),
                                     "digest":f"热度:{w.get('hot_value')}"})
                      if len(items)>=limit: break
                  return items
              except Exception as e:
                  print(f"[douyin] err: {e}", flush=True)
                  return []

          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
          date_str=now.strftime("%Y-%m-%d")
          out_dir=Path("news")
          out_dir.mkdir(parents=True, exist_ok=True)
          md_path=out_dir/f"{date_str}.md"

          # 1. 抖音热榜
          items=douyin_hot(limit=15)
          seen=set(i["title"] for i in items)

          # 2. 新浪7x24 (每轮最多取 20 条新)
          try:
              body=get("https://app.cj.sina.com.cn/api/news/pc?page=1&num=50")
              d=json.loads(body)
              feed=d.get("result",{}).get("data",{}).get("feed",{}).get("list",[])
              for it in feed[:20]:
                  t=it.get("rich_text","")
                  if not t or t in seen: continue
                  seen.add(t)
                  items.append({"ts":it.get("create_time","")[:19],
                                 "title":f"[新浪7x24] {t[:80]}",
                                 "src":"sina-7x24", "digest":t[:160]})
          except Exception as e:
              print(f"[sina] err: {e}", flush=True)

          # 3. 东财新闻 (远端回退: stocks-data-news)
          try:
              body=get(f"https://raw.githubusercontent.com/qwerzxcva/stocks-data-news/main/news/{date_str}.md")
              for line in body.splitlines():
                  m=re.match(r'\s*-\s*\[(\d{4}-\d{2}-\d{2}\s*\d{2}:\d{2}(?::\d{2})?)\]\s+(.+)', line)
                  if not m: continue
                  ts,title=m.group(1), m.group(2).strip()
                  if title in seen or len(title)<6: continue
                  seen.add(title)
                  items.append({"ts":ts[:19], "title":f"[东财归档] {title[:80]}", "src":"data-news", "digest":title[:160]})
          except Exception: pass

          # dedup + 排序
          items.sort(key=lambda x: x.get("ts","") or "", reverse=True)
          print(f"[kol-collector] {len(items)} items", flush=True)

          # 写 MD
          md=["# KOL & 平台热榜 财经新闻 {date_str}", "",
              f"- 生成: {now.strftime('%Y-%m-%d %H:%M')} · 抖音热榜 + 新浪7x24 + 东财归档 · 零凭据"]
          for it in items[:50]:
              md.append(f"- [{it['ts']}] {it['title']}  \n  - 来源: {it['src']}  \n  - {it['digest'][:100]}")
          md_path.write_text("\n".join(md), encoding="utf-8")

          # 写 JSON (供 ai_screener 调用)
          report={"ts":now.isoformat(), "items":items,
                   "meta":{"source":"auto-kol-collector","zero_cred":True,"srcs":["douyin-hot","sina-7x24","data-news"]}}
          json_path=out_dir/f"{date_str}.json"
          json_path.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"written {md_path} ({len(items)} items)", flush=True)
          PYEOF

      - name: Commit & push
        run: |
          git config user.name "kol-bot"
          git config user.email "kol-bot@users.noreply.github.com"
          git add -A
          ts=$(TZ=Asia/Shanghai date '+%Y%m%d_%H%M')
          git diff --quiet HEAD && echo "no changes" || {
            git commit -m "auto-kol $ts" && \
            git -c http.version=HTTP/1.1 push origin main
          }
